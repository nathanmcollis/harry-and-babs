<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ee65a9">
  <title>Babs + Henry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <audio id="bg-music" autoplay loop preload="auto">
    <source src="assets/Hava-Nagila.mp3" type="audio/mpeg">
  </audio>

  <div class="snow-layer" id="snow" aria-hidden="true"></div>

  <main class="site">
    <section class="hero" aria-label="Babs and Henry on their wedding cake">
      <img class="cake" src="assets/cakecolour2.jpg" alt="Green wedding cake with white icing and cherries">
      <img class="couple" src="assets/harry-babs.gif" alt="Babs and Henry">
    </section>

    <section class="invitation">
      <img class="invite-title" src="assets/title-transparent.png" alt="Babs and Henry invite you to their wedding">

      <div class="event-details">
        <p class="date">Invite you to their wedding</p>
        <p class="date">Sunday 17 January 2027</p>
        <p class="location">Hora dancing 8pm Alma Park East Oval</p>
      </div>

      <a class="rsvp-link" href="https://withjoy.com/babs-and-harry/rsvp" aria-label="RSVP">
        <img class="rsvp-button" src="assets/RSVP-final.gif" alt="RSVP">
      </a>

      <p class="site-credit">Designed + coded by Nathan Collis</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
